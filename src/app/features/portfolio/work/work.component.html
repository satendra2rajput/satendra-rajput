<section id="work" class="wrap sec" aria-labelledby="wk-h">
  <div class="sec__h" appReveal>
    <div>
      <p class="eyebrow"><b>03</b>Projects</p>
      <h2 id="wk-h" class="h2">Selected work.</h2>
    </div>
  </div>

  <div class="bento">
    <!-- ================= KudoEngineer (featured) ================= -->
    <article class="card dark kudo c12" appReveal>
      <div>
        <div class="kudo__brand">
          <img class="klogo klogo--lg" src="assets/images/kudoengineer-logo.png" alt="KudoEngineer logo" width="64" height="64" />
          <p class="idx">{{ kudo.period }}</p>
        </div>
        <h3>KUDO<wbr />ENGINEER</h3>
        <p class="kind">{{ kudo.kind }}</p>
        <p class="desc">{{ kudo.text }}</p>
        <ul class="chips">
          @for (tag of kudo.tags; track tag) {
            <li>{{ tag }}</li>
          }
        </ul>
        <a class="pill" [href]="kudoUrl" target="_blank" rel="noopener">
          Visit project
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </a>
      </div>

      <!-- animated UI preview (pure CSS) -->
      <div class="mock" aria-hidden="true">
        <div class="mock__bar"><i></i><i></i><i></i><b>kudoengineer.com</b></div>
        <div class="mock__body">
          <aside class="mock__side">
            <span style="--d: 0.1s"></span><span style="--d: 0.25s"></span><span style="--d: 0.4s"></span><span style="--d: 0.55s"></span><span style="--d: 0.7s"></span>
          </aside>
          <div class="mock__main">
            <div class="ml lg"></div>
            <div class="ml md"></div>
            <div class="mc"><div style="--d: 0.2s"></div><div style="--d: 0.6s"></div><div style="--d: 1s"></div></div>
            <pre class="code"><code>const path = signal('Angular');
path.set('Angular + Spring Boot');<span class="caret"></span></code></pre>
          </div>
        </div>
      </div>
    </article>

    <!-- these two render straight into the same bento grid (display: contents) -->
    <app-libraries />
    <app-projects />
  </div>
</section>
