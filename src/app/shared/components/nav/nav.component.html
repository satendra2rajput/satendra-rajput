<header class="nav" [class.scrolled]="scrolled()">
  <div class="nav__in">
    <a class="logo" href="#top" aria-label="Satendra Rajput — top">Satendra<i>.</i></a>

    <nav class="links" aria-label="Primary">
      @for (link of links; track link.id) {
        <a [href]="'#' + link.id" [class.on]="active() === link.id">{{ link.label }}</a>
      }
      <a class="npmlink" [href]="npmUrl" target="_blank" rel="noopener">
        <svg class="n" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="4" fill="#cb3837" /><path d="M5 19V5h14v14h-3.5V8.5H12V19z" fill="#fff" /></svg>npm<svg class="ar" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9" /></svg><span class="sr-only">(opens in a new tab)</span>
      </a>
    </nav>

    <div class="nav__r">
      <button class="iconbtn" type="button" aria-label="Toggle light / dark theme" (click)="theme.toggle()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" /></svg>
      </button>
      <a class="pill" href="#contact">Contact</a>
      <button
        class="iconbtn burger"
        type="button"
        aria-controls="mmenu"
        [attr.aria-expanded]="open()"
        [attr.aria-label]="open() ? 'Close menu' : 'Open menu'"
        (click)="open.set(!open())"
      >
        <i></i><i></i>
      </button>
    </div>
  </div>

  <nav class="mmenu" id="mmenu" [class.open]="open()" aria-label="Mobile">
    @for (link of links; track link.id) {
      <a [href]="'#' + link.id" (click)="open.set(false)">{{ link.label }}</a>
    }
    <a href="#contact" (click)="open.set(false)">Contact</a>
    <a [href]="npmUrl" target="_blank" rel="noopener" (click)="open.set(false)">
      <span class="mm-l"><svg class="n" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="4" fill="#cb3837" /><path d="M5 19V5h14v14h-3.5V8.5H12V19z" fill="#fff" /></svg>npm — &#64;kudoengineer</span>
      <svg class="ar" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9" /></svg>
    </a>
  </nav>
</header>
