  <!-- apply the saved light/dark choice before first paint (no flash) -->
  <script>
    try { var t = localStorage.getItem('sr-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>

  <!-- build-on-load intro: keep the page hidden until PageBuildService has prepared it (core/services/page-build.service.ts).
       Only on a hard load of "/", never with reduced-motion; the timeout is a fail-safe so the page can never stay hidden. -->
  <script>
    try {
      var h = document.documentElement;
      if (location.pathname === '/' && window.CSS && CSS.highlights && window.Highlight && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        h.classList.add('ib-gate');
        setTimeout(function () { h.classList.remove('ib-gate'); }, 6000);
      }
    } catch (e) {}
  </script>
